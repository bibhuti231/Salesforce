<template>

    <lightning-card title="getContacts" icon-name="custom:custom14">

        <lightning-button label="Refresh" onclick={handleRefresh}></lightning-button>

        <lightning-button label="Add" onclick={addnew}></lightning-button>

        
        <template if:true={showChild}>

            <section role="dialog" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">

                    
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Add Contact</h2>
                    </header>

                    
                    <div class="slds-modal__content slds-p-around_medium">

                        <lightning-input label="Name" onchange={changeName}></lightning-input>

                        <lightning-input type="email" label="Email" onchange={changeEmail}></lightning-input>

                        <lightning-input type="tel" label="Phone" onchange={changePhone}></lightning-input>
                        

                        <lightning-button label="Submit" onclick={handleSubmit}></lightning-button>

                    </div>

                  
                    <footer class="slds-modal__footer">
                        <lightning-button label="Close" onclick={remove}></lightning-button>
                    </footer>

                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>

        </template>

        
        <table border="1">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Account Name</th>
                    <th>Created Date</th>
                </tr>
            </thead>

            <tbody>
                <template if:true={contacts}>
                    <template for:each={contacts} for:item="contact">

                        <tr key={contact.Id}>
                            <td>{contact.Name}</td>
                            <td>{contact.Email}</td>
                            <td>{contact.Phone}</td>
                            <td>
                                <template if:true={contact.Account}>
                                    {contact.Account.Name}
                                </template>
                                <template if:false={contact.Account}>
                                    No Account
                                </template>
                                
                            </td>
                            <!-- <td>{contact.Account.Name}</td> -->
                            <td>
    <lightning-formatted-date-time 
        value={contact.CreatedDate}
        year="numeric"
        month="short"
        day="2-digit"
        hour="2-digit"
        minute="2-digit">
    </lightning-formatted-date-time>
</td>
                            
                        </tr>

                    </template>
                </template>
            </tbody>

        </table>

    </lightning-card>

</template>
