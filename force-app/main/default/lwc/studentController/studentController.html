<template>
    <lightning-button label="add" onclick={handleAdd}></lightning-button>
    <table border="2"  cellpadding="5">
        <tr>
            <!-- <th>Id</th> -->
        <th>Name</th>
        <th>Email</th>
        <th>Age</th>
        <th>created Date</th>
        <th>Enrolled fullTime</th>
        <th>Salsesforce SkillSet</th>
        <th>Stream</th>
        <th>class Name</th>
        <th>class fee</th>
        <th>view</th>
        <th>delete</th>
        </tr>
        
           <template for:each={students} for:item="std">
            
            <tr key={std.Id}>
            <!-- <td>{std.Id}</td> -->
            <td><template if:true={std.Name__c}>{std.Name__c}</template>
            <template if:false={std.Name__c}>notFound</template>
            </td>
            <td>
                <template if:true={std.Email__c}>{std.Email__c}</template>
            <template if:false={std.Email__c}>notFound</template>
            </td>
            <td>
                <template if:true={std.age__c}>{std.age__c}</template>
            <template if:false={std.age__c}>notFound</template>
            </td>
            <td>
                <template if:true={std.CreatedDate}>{std.CreatedDate}</template>
            <template if:false={std.CreatedDate}>notFound</template>
            </td>
            <td>
                <template if:true={std.Enrolled_full_time__c}>{std.Enrolled_full_time__c}</template>
                <template if:false={std.Enrolled_full_time__c}>notFound</template>
            </td>
            <td>
                <template if:true={std.Salesforce_skills__c}>{std.Salesforce_skills__c}</template>
            <template if:false={std.Salesforce_skills__c}>notFound</template>
            </td>
            <td>
                <template if:true={std.Stream__c}>{std.Stream__c}</template>
            <template if:false={std.Stream__c}>notFound</template>
            </td>
            <td>
                <template if:true={std.Class__r}>{std.Class__r.Name}</template>
            <template if:false={std.Class__r}>notFound</template>
            </td>
            <td>
                <template if:true={std.Class__r}>{std.Class__r.fees__c}</template>
            <template if:false={std.Class__r}>notFound</template>
            </td>
            <td> <lightning-button label="view" data-id={std.Id} onclick={viewDetails} ></lightning-button></td>
            <td><lightning-button label="delete" data-id={std.Id} onclick={deleteDetails} ></lightning-button></td>
          
        </tr>

         </template>
         

         
    </table>


    <template if:true={isView}>
    <!-- Backdrop (makes modal visible over the page) -->
    <div class="slds-backdrop slds-backdrop_open"></div>

    <section role="dialog" class="slds-modal slds-fade-in-open" aria-modal="true">
        <div class="slds-modal__container">
            
            <!-- Modal Header -->
            <header class="slds-modal__header">
                <h2 class="slds-text-heading_medium">Edit Student</h2>
                <!--  Close button -->
                <lightning-button-icon
                    icon-name="utility:close"
                    onclick={closeModal}
                    alternative-text="Close"
                    class="slds-modal__close">
                </lightning-button-icon>
            </header>

            <!-- Modal Body -->
            <div class="slds-modal__content slds-p-around_medium">
                <lightning-input type="text" label="Name" name='Name' onchange={handleChange} value={st.Name__c} ></lightning-input>
                <lightning-input type="number" label="Age" name='age' onchange={handleChange} value={st.age__c} ></lightning-input>
                <lightning-input type="email" label="Email" name='Email' onchange={handleChange} value={st.Email__c} ></lightning-input>
                <lightning-input type="checkbox" name='Enrolled_full_time' onchange={handleChange} label="Enrolled fullTime" checked={st.Enrolled_full_time__c} ></lightning-input>
                <lightning-dual-listbox
                label="Salesforce Skills"
                name="Salesforce_skills"
                source-label="Avaliable"
                selected-label="Selected"
                field-lavel-help="Select your skills"
                options={skillOptions}
                value={selectedSkills}
                onchange={handleSkillChange}
                >

                </lightning-dual-listbox>

                <lightning-combobox
                label="class"
                name="class"
                options={classOptions}
                value={selectedClass}
                onchange={handleClassChange}
                >

                </lightning-combobox>
                <!-- <template lwc:if={std.Class__r}>fees:{std.Class__r.fees__c}</template> -->


            </div>

            <!-- Modal Footer -->
            <footer class="slds-modal__footer">
                <lightning-button label="update" onclick={handleUpdate}></lightning-button>
                <lightning-button label="Close" onclick={closeModal}></lightning-button>
            </footer>

        </div>
    </section>

</template>


     <div if:true={modalAdd}>

    <div class="slds-backdrop slds-backdrop_open"></div>

    <section role="dialog" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <div class="slds-modal__content slds-p-around_medium">
                <lightning-input type="text" label="Name" name='Name' onchange={handleChange} ></lightning-input>
                <lightning-input type="number" label="Age" name='age' onchange={handleChange} ></lightning-input>
                <lightning-input type="email" label="Email" name='Email' onchange={handleChange} ></lightning-input>
                <lightning-input type="checkbox" name='Enrolled_full_time' onchange={handleChange} label="Enrolled fullTime" ></lightning-input>
                <lightning-combobox
                label="class"
                name="class"
                options={classOptions}
                value={selectedClass}
                onchange={handleClassChange}
                >
                    
                


                </lightning-combobox>

                <lightning-dual-listbox
    label="Salesforce Skills"
    name="Salesforce_skills"
    source-label="Available"
    selected-label="Selected"
    field-level-help="Select your skills"
    options={skillOptions}
    value={selectedSkills}
    onchange={handleSkillChange}>
</lightning-dual-listbox>

                
            </div>
            <lightning-button label="submit" onclick={handleSubmit}></lightning-button>
            <lightning-button label="close" onclick={handleClose2}></lightning-button>
        </div>
        
    </section>

</div>

        <div class="slds-backdrop slds-backdrop_open"></div>
        <section role="dialog" class="slds-modal slds-fade-in-open" >
            <div class="slds-modal__container">
                <p>name: {st.Name__c}</p>
                <p>age:{st.age__c}</p>
            </div>
        </section>
    </template> -->
</template>
